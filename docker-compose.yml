services:
  db:
    image: postgres:16-alpine
    container_name: mm_saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mm_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mm_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-mm_saas_ebt}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_mm_saas:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mm_admin} -d ${POSTGRES_DB:-mm_saas_ebt}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mm_saas_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://mm_admin:mm_secret_2026@db:5432/mm_saas_ebt}
      MM_JWT_SECRET: ${MM_JWT_SECRET:-mm-saas-jwt-secret-key-production-2026-hmac-sha256}
      MM_PDF_SIGNING_SECRET: ${MM_PDF_SIGNING_SECRET:-mm-saas-pdf-hmac-secret-2026}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8}
    ports:
      - "8000:8000"
    volumes:
      - storage_dossies_mm:/app/storage_dossies

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: mm_saas_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mm_saas_streamlit_legacy
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://mm_admin:mm_secret_2026@db:5432/mm_saas_ebt}
      MM_JWT_SECRET: ${MM_JWT_SECRET:-mm-saas-jwt-secret-key-production-2026-hmac-sha256}
      MM_PDF_SIGNING_SECRET: ${MM_PDF_SIGNING_SECRET:-mm-saas-pdf-hmac-secret-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8}
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - storage_dossies_mm:/app/storage_dossies

volumes:
  pgdata_mm_saas:
  storage_dossies_mm:
