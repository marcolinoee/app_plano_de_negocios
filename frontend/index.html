<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Master Management — Strategic Consulting & Venture Capital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cinzel:wght@600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --color-master-red: #E30000;
        --color-master-red-hover: #C00000;
        --color-master-dark: #0A0A0A;
        --color-master-surface: #121212;
      }
      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
      }
      .font-executive {
        font-family: "Inter", system-ui, sans-serif;
        letter-spacing: -0.02em;
      }
      .st-card {
        background: #ffffff;
        border-radius: 12px;
        border: 1px solid #E2E8F0;
        border-left: 4px solid #E30000;
        padding: 20px;
        box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.05);
      }
      .st-btn {
        background: #E30000;
        color: #ffffff;
        border-radius: 8px;
        padding: 10px 20px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: all 0.2s ease-in-out;
        border: 1px solid transparent;
      }
      .st-btn:hover:not(:disabled) {
        background: #C00000;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(227, 0, 0, 0.25);
      }
      .st-btn:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(227, 0, 0, 0.4);
      }
      .st-btn:disabled {
        background: #94a3b8;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      .st-input {
        border-radius: 8px;
        border: 1px solid #CBD5E1;
        background: #ffffff;
        padding: 9px 12px;
        width: 100%;
        color: #0F172A;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
      }
      .st-input:focus {
        outline: none;
        border-color: #E30000;
        box-shadow: 0 0 0 3px rgba(227, 0, 0, 0.2);
      }
      .st-input:disabled {
        background: #F1F5F9;
        color: #64748B;
      }
      /* Custom scrollbar for horizontal tabs & drawer */
      .tabs-scrollbar::-webkit-scrollbar {
        height: 4px;
        width: 6px;
      }
      .tabs-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      .tabs-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(227, 0, 0, 0.4);
        border-radius: 4px;
      }
      .tabs-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #E30000;
      }
      /* Focus ring for accessibility WCAG 2.1 */
      *:focus-visible {
        outline: 2px solid #E30000;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-[#E30000] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
